# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi98
  name: "五笔98"
  version: "6.0"
  author:
    - 发明人 王永民
  description: |
    五笔98版
    码表源自 yanhuacuo
    敲 z 键进入拼音反查
  dependencies:
    - py

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中,英 ]
  - name: zh_trad
    reset: 0
    states: [ 简,繁 ]
  - name: new_spelling
    reset: 0
    states: [ 隐,显 ]
  - name: rvl_zhuyin
    reset: 1
    states: [ 形,拼 ]
  - name: GB2312
    reset: 0
    states: [ 扩,常 ]
  - name: new_hide_pinyin
    reset: 1
    states: [ 音, 哑 ]
  - name: single_char
    reset: 0
    states: [ 词, 单 ]
  - name: jiayin
    reset: 1
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
  - name: full_shape
    reset: 0
    states: [ 半, 全 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - "affix_segmentor@rvlk_segmentor"
    - fallback_segmentor
  translators:
    - punct_translator
    - "script_translator@py_translator"
    - "table_translator@openfly_translator"
    - table_translator
    - "history_translator@history"
    - "lua_translator@helper"
    - "lua_translator@time_date"
  filters:
    - simplifier
    # - lua_filter@single_char
    - "reverse_lookup_filter@wubi_reverse_lookup_filter"
    - qjs_filter@wubi98/spelling
    - uniquifier

speller:
  auto_select: true
  auto_clear: max_length
  delimiter: "`"
  max_code_length: 4

translator:
  dictionary: wubi98_ci.extended
  db_class: tabledb
  initial_quality: 100000
  enable_charset_filter: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  max_phrase_length: 4
  enable_completion: false
  enable_user_dict: false
  disable_user_dict_for_patterns:
    - "^z.*$"

# affix_segmentor 使用的配置块 - 分离 prefix 并打rvlk标签
rvlk_segmentor:
  prefix: z
  tag: rvlk


# table_translator 使用的配置块 - 包含翻译器所需的完整配置
py_translator:
  dictionary: wanxiang
  tag: rvlk
  tips: "〔拼音反查〕"
  enable_correction: false
  enable_completion: true
  core_word_length: 4          # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7           # >0 启用，过长短语不记整词，只加元素权重
  contextual_suggestions: false  #模型用来开启词组权重预测，效果一般关闭
  max_homophones: 8
  initial_quality: 3           #初始质量拼音的权重应该比英文大
  spelling_hints: 30           #将注释以词典code字符串形式完全暴露，通过super_comment.lua完全接管，灵活配置。
  always_show_comments: true   # Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供super_comment_preedit.lua做判断用。
  comment_format: {comment}

openfly_translator:
  dictionary: openfly
  tag: rvlk
  tips: "〔小鹤反查〕"
  initial_quality: 100000
  contextual_suggestions: false
  max_homophones: 7
  enable_sentence: false
  enable_completion: true

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 7
  collocation_min_length: 3
  collocation_penalty: -10
  non_collocation_penalty: 3
  weak_collocation_penalty: -35
  rear_penalty: -12

wubi_reverse_lookup_filter:
  dictionary: wubi98_ci.extended
  tags:
    - rvlk

simplifier:
  opencc_config: s2t.json
  option_name: zh_trad

recognizer:
  import_preset: default
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    rvlk: "^z[a-z]*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
    helper: '^help$'

charset_filter:
  option_name: gb2312

history:
  input: z
  size: 1
  initial_quality: 1

key_binder:
  import_preset: default
  bindings:
    - {send: Up, accept: Left, when: has_menu}
    - {send: Down, accept: Right, when: has_menu}
    - {send: Page_Up, accept: comma, when: has_menu}
    - {send: Page_Down, accept: period, when: has_menu}
    - {send: Escape, accept: space, when: composing}
    - {send: space, accept: space, when: has_menu}
    - {toggle: zh_trad, accept: "Control+Shift+4", when: always}
    - {toggle: zh_trad, accept: "Control+Shift+dollar", when: always}
    - {toggle: zh_trad, accept: "Control+Shift+F", when: always}
    - {toggle: new_spelling, accept: "Control+Shift+H", when: always}
    - {toggle: new_hide_pinyin, accept: "Control+Shift+J", when: always}
    - {toggle: single_char, accept: "Control+Shift+K", when: always}
    - {accept: semicolon, send: 2, when: has_menu}
    - {accept: apostrophe, send: 3, when: has_menu}
    - {accept: space, send: Escape, when: composing}
    - {accept: space, send: space, when: has_menu}
    - {accept: Return, send: Escape, when: composing}
    - {accept: Return, send: Escape, when: has_menu}
    - {accept: "Control+Shift+4", toggle: zh_trad, when: always}
    - {accept: "Control+Shift+dollar", toggle: zh_trad, when: always}
    - {accept: "Control+Shift+F", toggle: zh_trad, when: always}
    - {accept: "Control+Shift+H", toggle: new_spelling, when: always}
    - {accept: "Control+Shift+J", toggle: new_hide_pinyin, when: always}
    - {accept: "Control+Shift+K", toggle: single_char, when: always}
    - {accept: "Control+Shift+U", toggle: GB2312, when: always}
    - {accept: "Control+Shift+I", toggle: GB2312, when: always}
    - {accept: "Control+Shift+O", toggle: GB2312, when: always}

punctuator:
  import_preset: symbols
  digit_separators: ""
  digit_separator_action: "commit"

menu:
  page_size: 9
